global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "skilltrace-prod"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:3100"]
        labels:
          environment: production

  - job_name: "skilltrace-staging"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:3101"]
        labels:
          environment: staging
