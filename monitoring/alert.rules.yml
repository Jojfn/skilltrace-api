groups:
  - name: skilltrace-availability
    rules:
      - alert: SkillTraceInstanceDown
        expr: up{job=~"skilltrace.*"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "SkillTrace instance is down ({{ $labels.environment }})"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for 30 seconds."

      - alert: SkillTraceHighErrorRate
        expr: >
          sum by (environment) (rate(skilltrace_http_requests_total{status=~"5.."}[1m]))
          /
          sum by (environment) (rate(skilltrace_http_requests_total[1m])) > 0.10
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "SkillTrace 5xx error rate above 10% ({{ $labels.environment }})"
          description: "More than one in ten requests is failing over the last minute."

      - alert: SkillTraceHighLatency
        expr: >
          histogram_quantile(0.95,
            sum by (le, environment) (rate(skilltrace_http_request_duration_seconds_bucket[1m]))
          ) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "SkillTrace p95 latency above 500ms ({{ $labels.environment }})"
          description: "The 95th percentile request duration has exceeded 500ms for a minute."
